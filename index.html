<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anna Laura AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* Fade-in animation */
    body {
      animation: fadeIn 1.2s ease-in forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Center container */
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Button */
    .cta-button {
      background: #fff;
      color: #000;
      border: none;
      padding: 28px 56px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 6px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255,255,255,0.15);
      opacity: 0.95;
    }

    .cta-button:active {
      transform: translateY(0);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <button
      class="cta-button"
      onclick="window.location.href='src/redirect.html'">
      Anna Laura AI
    </button>
  </div>
</body>
</html>
