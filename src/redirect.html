<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anna Laura AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .back {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .back:hover {
      background: rgba(255,255,255,0.25);
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <button class="back" onclick="history.back()">← Back</button>

  <iframe
      src="https://www.chatbase.co/chatbot-iframe/ULpTuAeCipF7EzmDyGK4N"
      width="100%"
      style="height: 100%; min-height: 700px"
      frameborder="0"
  ></iframe>

</body>
</html>
