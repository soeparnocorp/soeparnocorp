<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anna Laura AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Back button */
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .back:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Almost invisible iframe */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0.02;
    }
  </style>
</head>
<body>

  <button class="back" onclick="history.back()">←</button>

  <iframe
    src="https://www.chatbase.co/ULpTuAeCipF7EzmDyGK4N/help"
    loading="lazy"
    referrerpolicy="no-referrer">
  </iframe>

</body>
</html>
